<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="AI Multimodal Chat, chat AI asinkron dengan generasi gambar, video, dan dokumen" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="240" rx="14" fill="#0d0d0d"/>
