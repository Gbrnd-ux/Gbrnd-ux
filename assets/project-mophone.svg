<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mophone, premium e-commerce storefront">
  <defs>
    <radialGradient id="g" cx="0.1" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace}
    .s{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif}
  </style>
  <rect width="1000" height="300" rx="16" fill="#0d0d0d"/>
  <rect width="1000" height="300" rx="16" fill="url(#g)"/>
  <rect x="0.5" y="0.5" width="999" height="299" rx="15.5" stroke="#2a2a2a"/>
  <line x1="510" y1="36" x2="510" y2="264" stroke="#232323"/>

  <!-- kiri -->
  <text class="m" x="40" y="52" font-size="12" letter-spacing="3" fill="#6b6b6b">FEATURED PROJECT</text>
  <text class="s" x="40" y="104" font-size="44" font-weight="800" letter-spacing="1" fill="#ffffff">Mophone</text>
  <text class="s" x="40" y="132" font-size="15" fill="#a3a3a3">Premium e-commerce storefront</text>
  <text class="s" x="40" y="168" font-size="14" fill="#7a7a7a">Online store for smartphones, tablets and</text>
  <text class="s" x="40" y="188" font-size="14" fill="#7a7a7a">accessories with a complete shopping flow,</text>
  <text class="s" x="40" y="208" font-size="14" fill="#7a7a7a">from browsing products to order confirmation.</text>

  <g class="m" font-size="12" letter-spacing="1" text-anchor="middle" fill="#d4d4d4">
    <rect x="40" y="232" width="108" height="30" rx="15" fill="#141414" stroke="#333333"/><text x="94" y="251">TypeScript</text>
    <rect x="158" y="232" width="76" height="30" rx="15" fill="#141414" stroke="#333333"/><text x="196" y="251">Vercel</text>
    <rect x="244" y="232" width="116" height="30" rx="15" fill="#141414" stroke="#333333"/><text x="302" y="251">E-Commerce</text>
  </g>

  <!-- status live -->
  <g transform="translate(430 46)">
    <circle r="4" fill="#ffffff"/>
    <circle r="4" stroke="#ffffff" stroke-opacity="0.6"><animate attributeName="r" values="4;10" dur="2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.6;0" dur="2s" repeatCount="indefinite"/></circle>
    <text class="m" x="14" y="4" font-size="11" letter-spacing="2" fill="#bdbdbd">LIVE</text>
  </g>

  <!-- kanan -->
  <text class="m" x="550" y="52" font-size="12" letter-spacing="3" fill="#6b6b6b">FEATURES</text>
  <g class="s" font-size="15" fill="#d9d9d9">
    <text class="m" x="550" y="100" fill="#6b6b6b">+</text><text x="574" y="100">Product catalog with category filter</text>
    <text class="m" x="550" y="138" fill="#6b6b6b">+</text><text x="574" y="138">Product detail with storage and color options</text>
    <text class="m" x="550" y="176" fill="#6b6b6b">+</text><text x="574" y="176">Cart drawer with quantity and subtotal</text>
    <text class="m" x="550" y="214" fill="#6b6b6b">+</text><text x="574" y="214">Sign in and account registration</text>
    <text class="m" x="550" y="252" fill="#6b6b6b">+</text><text x="574" y="252">4-step checkout with promo code</text>
  </g>
</svg>
