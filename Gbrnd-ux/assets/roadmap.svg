<svg width="1000" height="210" viewBox="0 0 1000 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Learning roadmap" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .n{font:500 12px 'JetBrains Mono',Consolas,'Courier New',monospace;letter-spacing:2px;fill:#5c5c5c;text-anchor:middle}
    .h{font:700 17px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#f2f2f2;text-anchor:middle}
    .s{font:400 13px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#7a7a7a;text-anchor:middle}
    .on{font:600 11px 'JetBrains Mono',Consolas,'Courier New',monospace;letter-spacing:2px;fill:#ffffff;text-anchor:middle}
    .off{font:500 11px 'JetBrains Mono',Consolas,'Courier New',monospace;letter-spacing:2px;fill:#555555;text-anchor:middle}
  </style>
  <rect width="1000" height="210" rx="14" fill="#0d0d0d"/>
  <rect x="0.5" y="0.5" width="999" height="209" rx="13.5" stroke="#262626"/>

  <line x1="100" y1="72" x2="900" y2="72" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="100" y1="72" x2="500" y2="72" stroke="#e5e5e5" stroke-width="2"/>

  <!-- aktif -->
  <circle cx="100" cy="72" r="11" fill="#ffffff"/>
  <circle cx="100" cy="72" r="11" stroke="#ffffff" stroke-opacity="0.5"><animate attributeName="r" values="11;22" dur="2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="72" r="11" fill="#ffffff"/>
  <circle cx="300" cy="72" r="11" stroke="#ffffff" stroke-opacity="0.5"><animate attributeName="r" values="11;22" dur="2s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0" dur="2s" begin="0.6s" repeatCount="indefinite"/></circle>

  <!-- berikutnya -->
  <circle cx="500" cy="72" r="11" fill="#ffffff"/><path d="M495 72.5l3.5 3.5L505.5 68" stroke="#0d0d0d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="700" cy="72" r="9" fill="#0d0d0d" stroke="#4a4a4a" stroke-width="2"/>
  <circle cx="900" cy="72" r="9" fill="#0d0d0d" stroke="#4a4a4a" stroke-width="2"/>

  <text class="n" x="100" y="40">01</text><text class="n" x="300" y="40">02</text><text class="n" x="500" y="40">03</text><text class="n" x="700" y="40">04</text><text class="n" x="900" y="40">05</text>

  <text class="h" x="100" y="124">HTML &amp; CSS</text><text class="s" x="100" y="146">Layout, Flexbox, Grid</text><text class="on" x="100" y="180">LEARNING</text>
  <text class="h" x="300" y="124">JavaScript</text><text class="s" x="300" y="146">DOM, events, fetch</text><text class="on" x="300" y="180">LEARNING</text>
  <text class="h" x="500" y="124">First Project</text><text class="s" x="500" y="146">Mophone E-Commerce</text><text class="on" x="500" y="180">DONE</text>
  <text class="h" x="700" y="124">Flutter &amp; Dart</text><text class="s" x="700" y="146">Simple mobile app</text><text class="off" x="700" y="180">NEXT</text>
  <text class="h" x="900" y="124">Open Source</text><text class="s" x="900" y="146">First contribution</text><text class="off" x="900" y="180">NEXT</text>
</svg>
