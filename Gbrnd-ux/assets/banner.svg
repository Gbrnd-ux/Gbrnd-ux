<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gibrand Pradana, Aspiring Front-End Web Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="1" stop-color="#181818"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8c8c8c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="typed">
      <rect x="66" y="196" width="0" height="34">
        <animate attributeName="width" from="0" to="440" begin="0.6s" dur="3s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="20" fill="url(#grid)"/>
  <rect width="1000" height="300" rx="20" fill="url(#glow)"/>

  <!-- dekorasi kanan -->
  <g transform="translate(830 150)">
    <circle r="118" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="3 9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </circle>
    <circle r="84" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="0" y="22" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="64" font-weight="700" fill="#ffffff" fill-opacity="0.16">&lt;/&gt;</text>
  </g>

  <!-- teks -->
  <text x="70" y="72" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" letter-spacing="4" fill="#6b6b6b">// HELLO, WORLD</text>
  <text x="70" y="136" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="60" font-weight="800" letter-spacing="2" fill="url(#name)">GIBRAND PRADANA</text>
  <text x="70" y="174" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" letter-spacing="1.5" fill="#a3a3a3">Aspiring Front-End Web Developer</text>

  <g clip-path="url(#typed)">
    <text x="70" y="221" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="18" fill="#d4d4d4" textLength="420" lengthAdjust="spacingAndGlyphs">&gt; building clean, responsive interfaces</text>
  </g>
  <rect x="70" y="204" width="10" height="22" fill="#e5e5e5">
    <animate attributeName="x" from="70" to="494" begin="0.6s" dur="3s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="930" y="270" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12" letter-spacing="3" fill="#4a4a4a">EST. 2026</text>
  <rect x="0.5" y="0.5" width="999" height="299" rx="19.5" stroke="#2a2a2a"/>
</svg>
