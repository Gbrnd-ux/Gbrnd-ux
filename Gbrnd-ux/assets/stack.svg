    .pill{fill:#141414;stroke:#333333}
    .p{font:500 14px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#e8e8e8;text-anchor:middle}
    .c{font:400 13px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#666666}
  </style>

  <g>
    <rect class="card" x="0.5" y="0.5" width="319" height="191" rx="14"/>
    <text class="t" x="24" y="38">FRONT-END</text>
    <rect class="pill" x="24" y="58" width="64" height="32" rx="16"/><text class="p" x="56" y="79">HTML</text>
    <rect class="pill" x="98" y="58" width="55" height="32" rx="16"/><text class="p" x="125.5" y="79">CSS</text>
    <rect class="pill" x="163" y="58" width="118" height="32" rx="16"/><text class="p" x="222" y="79">JavaScript</text>
    <rect class="pill" x="24" y="100" width="118" height="32" rx="16"/><text class="p" x="83" y="121">TypeScript</text>
    <text class="c" x="24" y="165">Structure, style and logic</text>
  </g>

  <g transform="translate(340 0)">
    <rect class="card" x="0.5" y="0.5" width="319" height="191" rx="14"/>
    <text class="t" x="24" y="38">MOBILE</text>
    <rect class="pill" x="24" y="58" width="91" height="32" rx="16"/><text class="p" x="69.5" y="79">Flutter</text>
