    <text class="c" x="24" y="165">Cross-platform apps</text>
  </g>

  <g transform="translate(680 0)">
    <rect class="card" x="0.5" y="0.5" width="319" height="191" rx="14"/>
    <text class="t" x="24" y="38">TOOLS</text>
    <rect class="pill" x="24" y="58" width="55" height="32" rx="16"/><text class="p" x="51.5" y="79">Git</text>
    <rect class="pill" x="89" y="58" width="82" height="32" rx="16"/><text class="p" x="130" y="79">GitHub</text>
    <rect class="pill" x="181" y="58" width="73" height="32" rx="16"/><text class="p" x="217.5" y="79">Linux</text>
    <rect class="pill" x="24" y="100" width="82" height="32" rx="16"/><text class="p" x="65" y="121">Vercel</text>
